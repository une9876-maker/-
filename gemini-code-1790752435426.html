<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중학교 기술·가정 생명기술 논술 평가</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8">
        <!-- 헤더 -->
        <div class="text-center mb-8">
            <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">중학교 2학년 기술·가정</span>
            <h1 class="text-2xl font-bold text-slate-800 mt-2">생명기술의 발달 논술 평가</h1>
            <p class="text-slate-600 text-sm mt-1">핵이식, 유전자재조합, 조직배양기술 중 관련 내용을 포함하여 찬성 또는 반대 입장을 논리적으로 작성해 주세요.</p>
        </div>

        <!-- 입력 폼 -->
        <form id="essayForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">학번</label>
                    <input type="text" id="studentId" required placeholder="예: 20115" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">이름</label>
                    <input type="text" id="studentName" required placeholder="예: 홍길동" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">나의 입장 선택</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="flex items-center justify-center p-3 border border-slate-300 rounded-lg cursor-pointer hover:bg-emerald-50 transition">
                        <input type="radio" name="stance" value="찬성" required class="text-emerald-600 focus:ring-emerald-500 mr-2">
                        <span class="font-semibold text-slate-800">찬성</span>
                    </label>
                    <label class="flex items-center justify-center p-3 border border-slate-300 rounded-lg cursor-pointer hover:bg-rose-50 transition">
                        <input type="radio" name="stance" value="반대" required class="text-rose-600 focus:ring-rose-500 mr-2">
                        <span class="font-semibold text-slate-800">반대</span>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">주로 다룰 생명기술 선택 (복수 선택 가능)</label>
                <div class="flex flex-wrap gap-4 mt-2">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" name="tech" value="핵이식" class="rounded text-emerald-600 focus:ring-emerald-500">
                        <span class="text-slate-700 text-sm">핵이식</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" name="tech" value="유전자재조합" class="rounded text-emerald-600 focus:ring-emerald-500">
                        <span class="text-slate-700 text-sm">유전자재조합</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" name="tech" value="조직배양기술" class="rounded text-emerald-600 focus:ring-emerald-500">
                        <span class="text-slate-700 text-sm">조직배양기술</span>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">근거 1</label>
                <textarea id="reason1" rows="3" required placeholder="첫 번째 근거와 그 이유를 구체적으로 작성하세요." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">근거 2</label>
                <textarea id="reason2" rows="3" required placeholder="두 번째 근거와 그 이유를 구체적으로 작성하세요." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transition shadow-md">
                논술문 제출하기
            </button>
        </form>
    </div>

    <!-- 스크립트 -->
    <script>
        // 제공해주신 Apps Script 웹 앱 배포 URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjU5MrrLDrRbrXgxkcZp8ta9fY2j1sCjBNbjbe5zgYLJRCn4tNfL7kulhBtRWonWS3/exec";

        document.getElementById('essayForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '제출 중입니다...';

            const studentId = document.getElementById('studentId').value.trim();
            const studentName = document.getElementById('studentName').value.trim();
            const stance = document.querySelector('input[name="stance"]:checked').value;
            
            const techCheckboxes = document.querySelectorAll('input[name="tech"]:checked');
            let selectedTechs = [];
            techCheckboxes.forEach((cb) => selectedTechs.push(cb.value));

            const reason1 = document.getElementById('reason1').value.trim();
            const reason2 = document.getElementById('reason2').value.trim();

            const data = {
                studentId: studentId,
                studentName: studentName,
                stance: stance,
                techs: selectedTechs.length > 0 ? selectedTechs.join(', ') : '선택 안 함',
                reason1: reason1,
                reason2: reason2
            };

            // fetch를 이용해 Apps Script로 데이터 전송 (CORS 우회를 위해 text/plain 처리 후 서버에서 JSON 파싱)
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    alert('성공적으로 제출되었습니다!');
                    document.getElementById('essayForm').reset();
                } else {
                    alert('저장 중 오류가 발생했습니다: ' + (result.error || '알 수 없는 오류'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('서버 통신 중 오류가 발생했습니다.');
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = '논술문 제출하기';
            });
        });
    </script>
</body>
</html>
